<!DOCTYPE html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7b35e9"><meta property="og:title" content="СИҚЫРЛЫ ӘРІПТЕР: ҚАЙ ӘРІП ЖОҒАЛДЫ?"><meta property="og:description" content="5 кезең, 25 сурет! Жоғалған әріпті тап!"><title>СИҚЫРЛЫ ӘРІПТЕР: ҚАЙ ӘРІП ЖОҒАЛДЫ?</title><style>
*{box-sizing:border-box}body{margin:0;font-family:'Times New Roman',serif;color:#141128;background:radial-gradient(circle at 5% 8%,#fff269 0,transparent 26%),radial-gradient(circle at 98% 15%,#ff8ecf 0,transparent 33%),radial-gradient(circle at 10% 90%,#72e5fb 0,transparent 32%),linear-gradient(125deg,#f7a3ff,#a6ffaf 45%,#ffc876);min-height:100vh}.app{max-width:1250px;margin:auto;padding:14px 20px 24px}h1{text-align:center;font-size:clamp(26px,3.5vw,48px);font-weight:900;line-height:1.1;margin:8px 0 10px;text-shadow:1px 2px white}.stages{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}button{font-family:'Times New Roman',serif;font-weight:900;cursor:pointer;touch-action:manipulation}.stage{font-size:clamp(19px,2.3vw,28px);padding:9px 20px;border:3px solid #fff;border-radius:16px;background:#fff;color:#222;box-shadow:0 4px 0 #a69bbc}.stage.active{background:#6027dc;color:white;box-shadow:0 4px 0 #32107c}.panel{background:rgba(255,255,255,.89);border:5px solid white;border-radius:32px;box-shadow:0 12px 34px #612ca53d;padding:12px 20px 20px;text-align:center}.status{font-size:clamp(21px,2.7vw,34px);font-weight:900;color:#5318a8;margin:2px}.picture{width:min(100%,340px);height:clamp(190px,30vh,310px);object-fit:contain;border:5px solid #ffca24;background:white;border-radius:25px;box-shadow:0 5px 0 #ff9c18;display:block;margin:8px auto 16px}.letters{display:flex;justify-content:center;gap:clamp(3px,1vw,11px);flex-wrap:nowrap;margin:0 auto 16px}.letter{width:clamp(39px,7.8vw,94px);height:clamp(64px,9.2vw,106px);display:grid;place-items:center;background:#fff7cf;border:4px solid #007cdb;border-radius:17px;font-size:clamp(39px,6.4vw,76px);font-weight:900;color:#050505;box-shadow:0 5px 0 #0a77a9}.letter.missing{background:#ffe0f0;border:5px dashed #eb197e;color:#cf0061}.letter.filled{background:#c6ffc8;border-color:#08a63d}.question{font-size:clamp(24px,3vw,39px);font-weight:900;color:#1c1654;margin:6px 0 10px}.choices{display:flex;justify-content:center;gap:clamp(8px,2vw,24px);flex-wrap:wrap}.choice{min-width:clamp(72px,13vw,130px);min-height:clamp(72px,10vw,100px);border:4px solid white;border-radius:23px;background:linear-gradient(#fff37c,#ffb32e);font-size:clamp(42px,6vw,72px);color:#080808;box-shadow:0 6px 0 #cf7908}.choice:active{transform:translateY(4px)}.choice:disabled{opacity:.65}.feedback{font-size:clamp(21px,3vw,36px);font-weight:900;min-height:45px;color:#078029;margin-top:13px}.bottom{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:9px}.bottom button{border:3px solid white;border-radius:14px;padding:10px 17px;font-size:clamp(17px,2vw,25px);background:#6136dd;color:white}.bottom button:last-child{background:#ed2779}.confetti{pointer-events:none;position:fixed;inset:0;overflow:hidden;z-index:20}.particle{position:absolute;width:11px;height:11px;border-radius:3px;animation:pop 1.3s ease-out forwards}@keyframes pop{0%{opacity:1;transform:translate(0,0) scale(.4) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.1) rotate(700deg)}}@media(min-width:1000px) and (min-height:650px){.picture{height:34vh;max-height:360px}}@media(max-width:550px){.app{padding:8px}.panel{padding:10px 6px 14px;border-radius:18px}.picture{height:27vh;min-height:160px;max-height:240px;margin-bottom:13px}.stage{padding:7px 11px}.letter{border-width:3px;border-radius:10px}.letters{gap:3px}.feedback{min-height:30px}}
</style></head><body><main class="app"><h1>🌈 СИҚЫРЛЫ ӘРІПТЕР: ҚАЙ ӘРІП ЖОҒАЛДЫ? ✨</h1><nav class="stages" id="stages"></nav><section class="panel"><div class="status" id="status"></div><img class="picture" id="picture" alt="Тапсырма суреті"><div class="letters" id="letters"></div><div class="question" id="question">Қай әріп жоғалды?</div><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="bottom"><button id="replay">🔄 Қайта ойнау</button><button id="previous">◀ Алдыңғы сөз</button><button id="next">Келесі сөз ▶</button></div></section></main><div class="confetti" id="confetti"></div><script>
const data=[[{"word": "балық", "img": "assets/1_1.webp"}, {"word": "банан", "img": "assets/1_2.webp"}, {"word": "мысық", "img": "assets/1_3.webp"}, {"word": "шыбын", "img": "assets/1_4.webp"}, {"word": "шар", "img": "assets/1_5.webp"}], [{"word": "тарақ", "img": "assets/2_1.webp"}, {"word": "айна", "img": "assets/2_2.webp"}, {"word": "қалам", "img": "assets/2_3.webp"}, {"word": "кітап", "img": "assets/2_4.webp"}, {"word": "күрек", "img": "assets/2_5.webp"}], [{"word": "анар", "img": "assets/3_1.webp"}, {"word": "алмұрт", "img": "assets/3_2.webp"}, {"word": "балапан", "img": "assets/3_3.webp"}, {"word": "түйе", "img": "assets/3_4.webp"}, {"word": "қоян", "img": "assets/3_5.webp"}], [{"word": "күн", "img": "assets/4_1.webp"}, {"word": "алма", "img": "assets/4_2.webp"}, {"word": "бақа", "img": "assets/4_3.webp"}, {"word": "бұрыш", "img": "assets/4_4.webp"}, {"word": "жүрек", "img": "assets/4_5.webp"}], [{"word": "шар", "img": "assets/5_1.webp"}, {"word": "шелек", "img": "assets/5_2.webp"}, {"word": "көбелек", "img": "assets/5_3.webp"}, {"word": "балға", "img": "assets/5_4.webp"}, {"word": "қарбыз", "img": "assets/5_5.webp"}]];let stage=0,step=0,missing=0,locked=false,timer=null,previousMissing={};const el=id=>document.getElementById(id);const alphabet=[...'АӘБВГҒДЕЖЗИЙКҚЛМНҢОӨПРСТУҰҮФХҺЦЧШЩЫІЭЮЯ'];function rand(n){return Math.floor(Math.random()*n)}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}function chooseMissing(word,key){let possibilities=[...word].map((_,i)=>i);if(possibilities.length>1&&previousMissing[key]!==undefined)possibilities=possibilities.filter(i=>i!==previousMissing[key]);let idx=possibilities[rand(possibilities.length)];previousMissing[key]=idx;return idx}function playTone(correct){try{let C=window.AudioContext||window.webkitAudioContext;let ctx=window._audio||(window._audio=new C());ctx.resume();let notes=correct?[523,659,784,1047]:[240,180];notes.forEach((freq,i)=>{let osc=ctx.createOscillator(),g=ctx.createGain();osc.type=correct?'sine':'triangle';osc.frequency.value=freq;g.gain.setValueAtTime(.0001,ctx.currentTime+i*.12);g.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+i*.12+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+i*.12+.24);osc.connect(g);g.connect(ctx.destination);osc.start(ctx.currentTime+i*.12);osc.stop(ctx.currentTime+i*.12+.25)})}catch(e){}}function fireworks(){const area=el('confetti');let colors=['#f52b89','#ffcb00','#18c4ff','#7c37f5','#28c75a','#ff6b24'];for(let i=0;i<85;i++){let p=document.createElement('span');p.className='particle';p.style.left=(25+rand(50))+'vw';p.style.top=(20+rand(45))+'vh';p.style.background=colors[rand(colors.length)];p.style.setProperty('--x',(rand(900)-450)+'px');p.style.setProperty('--y',(rand(800)-400)+'px');area.append(p);setTimeout(()=>p.remove(),1400)}}function options(word,index){let answer=[...word][index].toUpperCase();let distractors=shuffle(alphabet.filter(x=>x!==answer));return shuffle([answer,distractors[0],distractors[1]])}function draw(){clearTimeout(timer);locked=false;const item=data[stage][step],chars=[...item.word];missing=chooseMissing(item.word,stage+'-'+step);el('picture').src=item.img;el('picture').alt=item.word;el('status').textContent=`${stage+1}-КЕЗЕҢ  •  ${step+1}/5 СӨЗ`;el('question').textContent='Қай әріп жоғалды?';el('feedback').textContent='';el('letters').innerHTML='';chars.forEach((ch,i)=>{let span=document.createElement('span');span.className='letter'+(i===missing?' missing':'');span.textContent=i===missing?'?':ch.toUpperCase();el('letters').append(span)});el('choices').innerHTML='';options(item.word,missing).forEach(ch=>{let b=document.createElement('button');b.className='choice';b.textContent=ch;b.onclick=()=>answer(ch);el('choices').append(b)});el('stages').innerHTML='';for(let i=0;i<data.length;i++){let b=document.createElement('button');b.className='stage'+(i===stage?' active':'');b.textContent=(i+1)+'-кезең';b.onclick=()=>{stage=i;step=0;draw()};el('stages').append(b)}}function answer(ch){if(locked)return;const correct=[...data[stage][step].word][missing].toUpperCase();if(ch!==correct){el('feedback').style.color='#d40048';el('feedback').textContent='Тағы ойланып көр! 💗';playTone(false);return}locked=true;el('letters').children[missing].textContent=correct;el('letters').children[missing].classList.add('filled');el('question').textContent='ДҰРЫС!';el('feedback').style.color='#078029';el('feedback').textContent='🎉 ЖАРАЙСЫҢ! 🎉';document.querySelectorAll('.choice').forEach(b=>b.disabled=true);playTone(true);fireworks();timer=setTimeout(()=>{if(step<4){step++;draw()}else if(stage<4){stage++;step=0;draw()}else{el('question').textContent='🏆 БАРЛЫҚ 5 КЕЗЕҢ АЯҚТАЛДЫ!';el('feedback').textContent='КЕРЕМЕТ! ҚАЙТА ОЙНАУҒА БОЛАДЫ! 🎉'}},1650)}el('replay').onclick=()=>{step=0;draw()};el('previous').onclick=()=>{if(step>0)step--;else if(stage>0){stage--;step=4}draw()};el('next').onclick=()=>{if(step<4)step++;else if(stage<4){stage++;step=0}else{stage=0;step=0}draw()};draw();
</script></body></html>
